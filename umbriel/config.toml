# Umbriel config, ported from niri/config.kdl

# generated by noctalia
[include.optional]
files = ["noctalia.toml"]

[general]
autostart = [
  "noctalia",
  "gnome-keyring-daemon --start --components=secrets",
  "wl-paste --watch cliphist store",
  "udiskie --tray",
  "discord",
  "obsidian",
]

[output.eDP-1]
mode = "1920x1080@60"
scale = 1.2
position = [0, 0]

[appearance]
corner_radius = 10
# borders were off in niri
border_width = 0

[appearance.blur]
radius = 3

[appearance.shadow]
enabled = true
softness = 30
offset_x = 0
offset_y = 5

[appearance.tab_bar]
style = "indicator"
position = "right"
height = 3
gap = 3

[input.keyboard]
numlock_toggle = true
repeat_delay = 400
repeat_rate = 35

[input.touchpad]
tap = true
natural_scroll = true
accel_profile = "adaptive"
scroll_method = "two_finger"
sensitivity = 0.2

[input.mouse]
sensitivity = 0.2

[layout]
mode = "scrolling"
gap = 8
extent_presets = [0.333, 0.5, 0.667]

# [layout.scrolling]
# default_extent_fraction = 0.5

[layout.tabs]
default_display = "normal"

# Keybinds (replaces the built-in set)
[keybinds]

# Apps
"Mod+T" = { action = "spawn kitty", repeat = false }
"Mod+S" = "spawn noctalia msg panel-toggle launcher"
"Mod+C" = "spawn noctalia msg panel-toggle control-center"
"Mod+Shift+Comma" = "spawn noctalia msg settings-toggle"
"Mod+E" = "spawn dolphin"
"Mod+Alt+L" = "spawn noctalia msg session lock"
"Mod+Alt+V" = "spawn noctalia msg panel-toggle clipboard"
"Mod+Slash" = "spawn emote"
"Mod+X" = "spawn noctalia msg panel-toggle session"
"Mod+Shift+D" = "spawn nwg-displays"
"Mod+Shift+Slash" = "cheatsheet-toggle"
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }

# Screenshots
"Print" = "spawn noctalia msg screenshot-region"
"Shift+Print" = "spawn noctalia msg screenshot-fullscreen"
"Alt+Print" = "spawn noctalia msg screenshot-window"
"Ctrl+Print" = "spawn noctalia msg screenshot-annotate"

# Screencast target (handled by the sharing plugin, keys reused below)
# "Mod+Shift+C" = "screencast-set-window"
# "Mod+Alt+C" = "screencast-set-output"
# "Mod+Shift+X" = "screencast-clear"

# Floating and scratchpad
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+Shift+C" = "window-center"
"Mod+Shift+X" = { action = "window-minimize", repeat = false }
"Mod+Alt+C" = { action = "workspace-toggle-show-desktop", repeat = false }
"Mod+Space" = "scratchpad-toggle"
"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false }
"Mod+Shift+Tab" = "scratchpad-focus-next"
"Mod+Alt+Space" = "scratchpad-window-show-next"
"Mod+Alt+Shift+Space" = "scratchpad-window-show-previous"

# Float mode: Mod+Alt+F, then move a floating window, Escape to leave.
# H/J/K/L nudge 40px, Shift+H/J/K/L nudge 200px, arrows snap a stacking window.
"Mod+Alt+F" = { action = "submap float", repeat = false }
"submap[float],H" = "window-move-by -40 0"
"submap[float],J" = "window-move-by 0 40"
"submap[float],K" = "window-move-by 0 -40"
"submap[float],L" = "window-move-by 40 0"
"submap[float],Shift+H" = "window-move-by -200 0"
"submap[float],Shift+J" = "window-move-by 0 200"
"submap[float],Shift+K" = "window-move-by 0 -200"
"submap[float],Shift+L" = "window-move-by 200 0"
"submap[float],C" = "window-center"
"submap[float],Left" = "window-set-region left"
"submap[float],Right" = "window-set-region right"
"submap[float],Up" = "window-set-region top"
"submap[float],Down" = "window-set-region bottom"
"submap[float],Escape" = "submap reset"
"submap[float],Return" = "submap reset"

# Tabs
"Mod+Alt+Left" = "column-focus-tab-previous"
"Mod+Alt+Right" = "column-focus-tab-next"
"Mod+Alt+Shift+Left" = "column-move-tab-previous"
"Mod+Alt+Shift+Right" = "column-move-tab-next"
"Mod+Alt+B" = "column-toggle-tab-bar"

# Other layouts
"Mod+Alt+S" = "layout-toggle-split"
"Mod+Alt+Equal" = "layout-master-count-increase"
"Mod+Alt+Minus" = "layout-master-count-decrease"
"Mod+Grave" = "window-focus-last"

# Media keys
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }

# Focus
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-next"
"Mod+K" = "window-focus-previous"
"Mod+L" = "window-focus-right"
"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"

# Move
"Mod+Ctrl+Left" = "column-move-left"
"Mod+Ctrl+Down" = "window-move-down"
"Mod+Ctrl+Up" = "window-move-up"
"Mod+Ctrl+Right" = "column-move-right"
"Mod+Ctrl+H" = "window-move-left"
"Mod+Ctrl+J" = "window-move-down"
"Mod+Ctrl+K" = "window-move-up"
"Mod+Ctrl+L" = "window-move-right"
"Mod+Ctrl+Home" = "column-move-to-first"
"Mod+Ctrl+End" = "column-move-to-last"

# Monitors
"Mod+Shift+Left" = "output-focus-left"
"Mod+Shift+Down" = "output-focus-down"
"Mod+Shift+Up" = "output-focus-up"
"Mod+Shift+Right" = "output-focus-right"
"Mod+Shift+H" = "output-focus-left"
"Mod+Shift+J" = "output-focus-down"
"Mod+Shift+K" = "output-focus-up"
"Mod+Shift+L" = "output-focus-right"
"Mod+Shift+Ctrl+Left" = "column-move-to-output-left"
"Mod+Shift+Ctrl+Down" = "column-move-to-output-down"
"Mod+Shift+Ctrl+Up" = "column-move-to-output-up"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"
"Mod+Shift+Ctrl+H" = "column-move-to-output-left"
"Mod+Shift+Ctrl+J" = "column-move-to-output-down"
"Mod+Shift+Ctrl+K" = "column-move-to-output-up"
"Mod+Shift+Ctrl+L" = "column-move-to-output-right"

# Workspaces
"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+U" = "workspace-next"
"Mod+I" = "workspace-previous"
"Mod+Ctrl+Page_Down" = "column-move-to-workspace-next"
"Mod+Ctrl+Page_Up" = "column-move-to-workspace-previous"
"Mod+Ctrl+U" = "column-move-to-workspace-next"
"Mod+Ctrl+I" = "column-move-to-workspace-previous"
"Mod+Shift+Page_Down" = "workspace-move-down"
"Mod+Shift+Page_Up" = "workspace-move-up"
"Mod+Shift+U" = "workspace-move-down"
"Mod+Shift+I" = "workspace-move-up"
"Mod+Tab" = "workspace-focus-last"
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+Ctrl+1" = "column-move-to-workspace 1"
"Mod+Ctrl+2" = "column-move-to-workspace 2"
"Mod+Ctrl+3" = "column-move-to-workspace 3"
"Mod+Ctrl+4" = "column-move-to-workspace 4"
"Mod+Ctrl+5" = "column-move-to-workspace 5"
"Mod+Ctrl+6" = "column-move-to-workspace 6"
"Mod+Ctrl+7" = "column-move-to-workspace 7"
"Mod+Ctrl+8" = "column-move-to-workspace 8"
"Mod+Ctrl+9" = "column-move-to-workspace 9"

# Mouse wheel
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+WheelDown" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }
"Mod+WheelRight" = "window-focus-right"
"Mod+WheelLeft" = "window-focus-left"
"Mod+Ctrl+WheelRight" = "column-move-right"
"Mod+Ctrl+WheelLeft" = "column-move-left"
"Mod+Shift+WheelDown" = "window-focus-right"
"Mod+Shift+WheelUp" = "window-focus-left"
"Mod+Ctrl+Shift+WheelDown" = "column-move-right"
"Mod+Ctrl+Shift+WheelUp" = "column-move-left"

# Columns and sizing
"Mod+BracketLeft" = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"
"Mod+Comma" = "window-consume-from-right"
"Mod+Period" = "window-consume-or-expel-right"
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-secondary-extent"
"Mod+Ctrl+C" = "column-center"
"Mod+Minus" = "window-modify-primary-extent -0.1"
"Mod+Equal" = "window-modify-primary-extent +0.1"
"Mod+Shift+Minus" = "window-modify-secondary-extent -0.1"
"Mod+Shift+Equal" = "window-modify-secondary-extent +0.1"

# Window state
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+V" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+V" = { action = "window-focus-switch-floating", repeat = false }
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }

# Cycle layouts
"Mod+Alt+T" = "workspace-set-layout toggle scrolling master dwindle"

# Session
"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Shift+E" = "session-quit"
"Ctrl+Alt+Delete" = "session-quit"
"Mod+Shift+P" = "dpms-off"

# Window rules
[[window_rule]]
blur = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia.Settings$"
default_floating = true
default_floating_size_px = { width = 1080, height = 820 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# DaVinci Resolve
[[window_rule]]
match.app_id = "^[Rr]esolve(\\.bin)?$"
default_floating = true
corner_radius = 0
blur = false

# Noctalia layers
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"
