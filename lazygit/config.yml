gui:
  # UI VISUALS
  border: "rounded"
  tabWidth: 4
  scrollOffMargin: 2
  scrollHeight: 10
  nerdFontsVersion: "3"
  # Make the time look like "2h" or "4d" instead of full dates
  timeFormat: "02 Jan 06"
  shortTimeFormat: "3:04PM"
  theme:
    # PREMIUM BLACK: jet black (#000), soft white text, restrained gold accent
    activeBorderColor:
      - "#d4af37"
      - bold
    inactiveBorderColor:
      - "#1f1f1f"
    searchingActiveBorderColor:
      - "#e6c76a"
      - bold
    optionsTextColor:
      - "#8a8a8a"
    selectedLineBgColor:
      - "#0d0d0d"
    inactiveViewSelectedLineBgColor:
      - "#080808"
    cherryPickedCommitFgColor:
      - "#d4af37"
    cherryPickedCommitBgColor:
      - "#0d0d0d"
    markedBaseCommitFgColor:
      - "#e6c76a"
    markedBaseCommitBgColor:
      - "#0d0d0d"
    unstagedChangesColor:
      - "#e5736b"
    defaultFgColor:
      - "#d8d8d8"
git:
  # This removes the technical "diff --git a/..." header noise
  parseEmoji: true
  diffRenderers:
    - colorArg: always
      # THE CLEANER PREVIEW CONFIG
      command: >-
        delta --dark --paging=never --line-numbers --hyperlinks --syntax-theme=Dracula --minus-style="syntax #3f2d3d" --plus-style="syntax #2d3f34" --minus-emph-style="normal #5a303c" --plus-emph-style="normal #3a5242" --file-style="omit" --hunk-header-style="omit"
  # Cleaner Log Graph
  branchLogCmd: >-
    git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --
  allBranchesLogCmds:
    - git log --graph --all --color=always --abbrev-commit --decorate --date=relative  --pretty=medium
customCommands:
  - key: '<c-s>'
    context: 'commits'
    description: 'Open compilation in Neovim (for yanking)'
    # 1. --pretty=format: Clean text format (No colors)
    # 2. | nvim -R - : Reads the input into Neovim in Read-Only mode
    # 3. -c "set ft=markdown": Sets syntax highlighting to Markdown so it looks pretty
    command: 'git log --author="$(git config user.name)" --no-merges --date=format:"%a %b %d, %I:%M %p" --pretty=format:"## [%ad] %s%n%b%n" | nvim -R -c "set ft=markdown" -'
    output: terminal
