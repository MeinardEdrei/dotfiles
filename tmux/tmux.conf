# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; \
    display-popup -E \
    -x R -y 2 \
    -w 30 -h 4 \
    -S "fg=colour7,bg=default,border-lines=simple,border-style=fg=colour0,bg=default" \
    "stty -echo; printf '\033[?25l\n \033[1;32m  Messages\033[0m\n    Config Reloaded!'; sleep 1.8"

set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g status off

# automatic name to be the directory when NOT in nvim
set-option -g automatic-rename on 

# Tell tmux to update these variables from the outside shell when re-attaching
set-option -g update-environment "DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_RUNTIME_DIR XDG_SESSION_TYPE"

# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Indexing
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g status-position top
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format "#{b:pane_current_path}"

# Shell
set-option -g default-shell /bin/fish

# --- STATUS BAR ---
set -g status-style "bg=default,fg=colour8"
set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200

# Left Side (Session Name)
set -g status-left "#[bg=default,fg=colour8,bold]   #S  #[fg=colour8]"
set -g status-right ""

# WINDOW TABS
set -g window-status-format "#[bg=default,fg=colour8]  #I  #W  #[fg=colour8]"
set -g window-status-current-format "#[bg=colour0,fg=colour7,bold]  #I  #W  #[fg=colour8]"

set -g window-status-separator ""

# --- PANES ---
set -g pane-active-border-style "fg=colour8"
set -g pane-border-style "fg=colour0"

# Swap panes
bind-key M-H swap-pane -U
bind-key M-K swap-pane -U
bind-key M-L swap-pane -D
bind-key M-J swap-pane -D

# ACTIVE PANE:
set -g pane-active-border-style "fg=colour7"

# INACTIVE PANE:
set -g pane-border-style "fg=colour8"

# --- MESSAGES & MODES ---
set -g mode-style "bg=colour0,fg=colour7"
set -g message-style "bg=default,fg=colour4"
set -g message-command-style "bg=default,fg=colour4"

# --- POPUPS ---
# set -g popup-style "bg=#0C0E12"
set -g popup-border-style "fg=colour8,bg=default"
set -g popup-border-lines rounded

# KEYBINDINGS

# New Session
bind n new-session
# New Window
bind c new-window -c "#{pane_current_path}"

# Splits
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Close
unbind &
bind X kill-window
bind x kill-pane

# Navigation
bind -n M-j switch-client -p
bind -n M-k switch-client -n
bind -n M-L switch-client -l
bind -n M-h previous-window
bind -n M-l next-window

# Swap windows
bind-key -n C-M-h swap-window -t -1\; select-window -t -1
bind-key -n C-M-l swap-window -t +1\; select-window -t +1

# Resize panes
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5
unbind z
bind -n M-z resize-pane -Z

# Vi mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Custom Popups
bind g popup -d "#{pane_current_path}" -xC -yC -w 90% -h 90% -E lazygit
bind b popup -d "#{pane_current_path}" -xC -yC -w 90% -h 90% -E btop
bind u popup -xC -yC -w 90% -h 90% -E "sudo ncdu /"

# PLUGINS

# [[ TELL TMUX TO USE CUSTOM PLUGINS FOLDER ]]
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-spotlight configuration
set -g @spotlight-preview 'on'
set -g @spotlight-preview-location 'right'
set -g @spotlight-preview-ratio '50%'
set -g @spotlight-background 'default'
set -g @spotlight-selection 'default'
# run-shell /home/batman/Desktop/tmux-spotlight/spotlight.tmux
set -g @plugin 'MeinardEdrei/tmux-spotlight'

# 4. ENABLE PREVIEW
# Exclude nvim from resurrect (auto-session handles it)
set -g @resurrect-processes 'less more man tail top htop'

set -g @continuum-restore 'on'

# This check works better with Fish shell to detect if Vim is running
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Explicitly bind C-h for copy mode too
bind-key -T copy-mode-vi 'C-h' select-pane -L

# Let kitty's graphics protocol through (inline images via icat, yazi, etc.)
set -g allow-passthrough on

# Run TPM from your config folder
run '~/.config/tmux/plugins/tpm/tpm'
