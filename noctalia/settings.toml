[dock]
auto_hide = false
cross_axis_padding = 3
enabled = true
icon_size = 37
magnification_scale = 1.1500000022351742
margin_edge = 10
smart_auto_hide = true

[hot_corners]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
fingerprint = false
wallpaper = "/home/batman/Pictures/Wallpapers/wallhaven-w55zwx.png"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 800.0
    cy = 783.0
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.0
        background_radius = 10.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
position = "bottom_center"

[plugin_settings."alexander/screen-toolkit"]
panel_placement = "attached"
record-audio-in = true
record-audio-out = true

[plugin_settings."andrewdems/printers"]
show_when_idle = true

[plugin_settings."aristides/udiskie"]
manager_placement = "attached"

[plugin_settings."noctalia/notes"]
panel_placement = "attached"

[plugin_settings."noctalia/screen_recorder"]
audio_source = "none"

[plugins]
enabled = [ "noctalia/notes", "alexander/screen-toolkit", "aristides/udiskie", "andrewdems/printers", "noctalia/wallhaven" ]

[shell]
avatar_path = "/home/batman/Documents/1x1.jpg"
clipboard_history_max_entries = 500
niri_overview_type_to_launch_enabled = true
polkit_agent = true
telemetry_enabled = true

    [shell.greeter_sync]
    auto_sync = true
    privilege_command = "kitty -e pkexec"

    [shell.launcher]
    app_grid = true

    [shell.panel]
    clipboard_placement = "attached"
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

