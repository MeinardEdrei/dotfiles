config_version = 14

[audio]
enable_overdrive = true

[backdrop]
enabled = true

[bar.default]
center = []
contact_shadow = true
end = [
    "tray",
    "status",
    "printer",
    "network",
    "bluetooth",
    "keyboard_layout",
    "volume",
    "battery",
    "weather",
    "notifications",
    "control-center",
    "clock"
]
font_family = "Inter SemiBold"
margin_edge = 0
scale = 0.90000000596046448
start = [ "workspaces", "active_window", "media", "clipboard" ]
thickness = 25

[battery]
warning_threshold = 20

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[control_center]
show_shortcut_labels = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "alexander/screen-toolkit:toggle"

    [[control_center.shortcuts]]
    type = "noctalia/wallhaven:shortcut"

